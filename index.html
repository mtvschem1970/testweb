<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบคลังสินค้า 2D (Spare Parts)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
        /* พื้นที่จำลองห้องคลังสินค้า */
        #roomCanvas {
            position: relative;
            width: 100%;
            height: 600px;
            background-color: #f1f5f9;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px; /* ลายตารางกริด */
            border: 2px solid #e2e8f0;
            border-radius: 0.75rem;
            overflow: hidden;
        }
        /* กล่องชั้นวางของ */
        .shelf-box {
            position: absolute;
            width: 250px;
            background: white;
            border: 2px solid #94a3b8;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            user-select: none;
        }
        .drag-handle { cursor: grab; }
        .drag-handle:active { cursor: grabbing; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen">

    <nav class="bg-blue-700 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">📦 ระบบคลังสินค้า 2D</h1>
            <div class="flex gap-2">
                <button onclick="switchTab('tab-inventory')" class="tab-btn bg-blue-800 px-4 py-2 rounded font-medium hover:bg-blue-900 transition">📋 จัดการ & สต๊อก</button>
                <button onclick="switchTab('tab-map')" class="tab-btn bg-blue-600 px-4 py-2 rounded font-medium hover:bg-blue-900 transition">🗺️ แผนผังห้อง</button>
                <button onclick="switchTab('tab-logs')" class="tab-btn bg-blue-600 px-4 py-2 rounded font-medium hover:bg-blue-900 transition">⏱️ ประวัติ</button>
                <button onclick="loadData()" class="bg-green-600 px-4 py-2 rounded font-medium hover:bg-green-700 transition">🔄 รีเฟรช</button>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 py-6">
        
        <div id="tab-inventory" class="tab-content grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-xl shadow border">
                <h2 class="text-lg font-bold mb-4 border-b pb-2">📝 ทำรายการ เบิกเข้า / ออก</h2>
                <form onsubmit="handleTransaction(event)">
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-1">เลือกอะไหล่</label>
                        <select id="partSelect" required class="w-full p-2 bg-gray-50 border rounded-lg"><option value="">-- รอโหลดข้อมูล --</option></select>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-1">ประเภทรายการ</label>
                        <div class="flex gap-4">
                            <label class="flex-1 p-2 border rounded cursor-pointer hover:bg-green-50"><input type="radio" name="actionType" value="IN" checked onchange="toggleVendor()"> 📥 เบิกเข้า</label>
                            <label class="flex-1 p-2 border rounded cursor-pointer hover:bg-red-50"><input type="radio" name="actionType" value="OUT" onchange="toggleVendor()"> 📤 เบิกออก</label>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-1">จำนวน</label>
                        <input type="number" id="transQty" min="1" required class="w-full p-2 bg-gray-50 border rounded-lg">
                    </div>
                    <div class="mb-4" id="vendorContainer">
                        <label class="block text-sm font-medium mb-1">แหล่งซื้อ (เฉพาะเบิกเข้า)</label>
                        <input type="text" id="transVendor" class="w-full p-2 bg-gray-50 border rounded-lg">
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm font-medium mb-1">หมายเหตุ / ผู้เบิก</label>
                        <input type="text" id="transNote" required class="w-full p-2 bg-gray-50 border rounded-lg">
                    </div>
                    <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-bold">บันทึกรายการ</button>
                </form>
            </div>

            <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow border">
                <h2 class="text-lg font-bold mb-4 border-b pb-2">📋 ของคงเหลือ</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-gray-100 border-b">
                            <tr>
                                <th class="p-3">รหัส</th>
                                <th class="p-3">ชื่ออะไหล่</th>
                                <th class="p-3">ตำแหน่ง (ชั้นวาง)</th>
                                <th class="p-3 text-center">คงเหลือ</th>
                            </tr>
                        </thead>
                        <tbody id="inventoryBody"><tr><td colspan="4" class="p-4 text-center">กำลังโหลด...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="tab-map" class="tab-content hidden bg-white p-6 rounded-xl shadow border">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold">🗺️ จัดการห้องคลังสินค้า (2D)</h2>
                <div class="flex gap-2">
                    <button onclick="addNewShelf()" class="bg-green-600 text-white px-3 py-1.5 rounded hover:bg-green-700 text-sm">➕ เพิ่มชั้นวางใหม่</button>
                    <button onclick="resetLayout()" class="bg-red-500 text-white px-3 py-1.5 rounded hover:bg-red-600 text-sm">⚠️ ล้างตำแหน่ง</button>
                </div>
            </div>
            <p class="text-sm text-gray-500 mb-4">คลิกค้างที่ชื่อชั้นวางแล้วลากเพื่อจัดตำแหน่งได้อิสระ</p>
            
            <div id="roomCanvas"></div>
        </div>

        <div id="tab-logs" class="tab-content hidden bg-white p-6 rounded-xl shadow border">
            <h2 class="text-lg font-bold mb-4 border-b pb-2">⏱️ ประวัติการเบิกเข้า-ออก</h2>
            <div class="overflow-x-auto h-[600px]">
                <table class="w-full text-sm text-left">
                    <thead class="bg-gray-100 border-b sticky top-0">
                        <tr>
                            <th class="p-3">วัน/เวลา</th>
                            <th class="p-3">รหัสอะไหล่</th>
                            <th class="p-3">รายการ</th>
                            <th class="p-3 text-center">จำนวน</th>
                            <th class="p-3">ผู้เบิก/หมายเหตุ</th>
                        </tr>
                    </thead>
                    <tbody id="logsBody"><tr><td colspan="5" class="p-4 text-center">กำลังโหลด...</td></tr></tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        // ⚠️ ใส่ URL ของ Apps Script ตรงนี้
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby9m1VsobxkvJwug77jO8Nnx-1RtSY3PFl-j1laMvlMXgRtm6bxXGjFF5XFmF6wvTvlwA/exec";
        
        let globalInventory = [];
        let globalLogs = [];
        let roomLayout = JSON.parse(localStorage.getItem('roomLayout2D')) || {};

        // --- ระบบสลับแท็บ ---
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
            
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.replace('bg-blue-800', 'bg-blue-600');
            });
            event.target.classList.replace('bg-blue-600', 'bg-blue-800');
        }

        function toggleVendor() {
            const action = document.querySelector('input[name="actionType"]:checked').value;
            document.getElementById('vendorContainer').style.display = action === 'IN' ? 'block' : 'none';
        }

        // --- โหลดข้อมูลจาก Google Sheets ---
        async function loadData() {
            if (!WEB_APP_URL) return;
            try {
                const res = await fetch(WEB_APP_URL);
                const data = await res.json();
                globalInventory = data.inventory || [];
                globalLogs = data.logs || [];
                
                renderInventory();
                renderLogs();
                render2DMap();
            } catch (error) {
                alert("โหลดข้อมูลล้มเหลว ตรวจสอบ URL หรืออินเทอร์เน็ต");
            }
        }

        function renderInventory() {
            const tbody = document.getElementById('inventoryBody');
            const select = document.getElementById('partSelect');
            tbody.innerHTML = "";
            select.innerHTML = '<option value="">-- เลือกอะไหล่ --</option>';

            globalInventory.forEach(item => {
                const id = item["รหัสอะไหล่ (ID)"] || item["ID"];
                const name = item["ชื่ออะไหล่ (Name)"] || item["Name"];
                const loc = item["ตำแหน่ง (Location)"] || item["Location"] || "-";
                const qty = Number(item["จำนวนคงเหลือ (Qty)"] || item["Qty"] || 0);

                tbody.insertAdjacentHTML('beforeend', `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-3 font-medium">${id}</td>
                        <td class="p-3 text-blue-600 font-semibold">${name}</td>
                        <td class="p-3"><span class="bg-gray-200 px-2 py-1 rounded text-xs">${loc}</span></td>
                        <td class="p-3 text-center font-bold ${qty <= 5 ? 'text-red-500' : 'text-green-600'}">${qty}</td>
                    </tr>
                `);
                select.insertAdjacentHTML('beforeend', `<option value="${id}">[${id}] ${name}</option>`);
            });
        }

        function renderLogs() {
            const tbody = document.getElementById('logsBody');
            tbody.innerHTML = "";
            // เรียงจากใหม่ไปเก่า (ล่างขึ้นบนของตาราง Sheets)
            const reversedLogs = [...globalLogs].reverse(); 
            
            reversedLogs.forEach(log => {
                const dateObj = new Date(log["วันเวลา (Timestamp)"] || log["Timestamp"]);
                const dateStr = dateObj.toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' });
                const action = log["ประเภท (Action)"] || log["Action"];
                const actionColor = action.includes("เข้า") ? "text-green-600 bg-green-50" : "text-red-600 bg-red-50";

                tbody.insertAdjacentHTML('beforeend', `
                    <tr class="border-b hover:bg-gray-50 text-xs md:text-sm">
                        <td class="p-3 text-gray-500">${dateStr}</td>
                        <td class="p-3 font-medium">${log["รหัสอะไหล่ (ID)"] || log["ID"]}</td>
                        <td class="p-3"><span class="px-2 py-1 rounded font-bold ${actionColor}">${action}</span></td>
                        <td class="p-3 text-center font-bold">${log["จำนวน (Qty)"] || log["Qty"]}</td>
                        <td class="p-3">${log["หมายเหตุ (Note)"] || log["Note"]}</td>
                    </tr>
                `);
            });
        }

        // --- ระบบ 2D Canvas &
